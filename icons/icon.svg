<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fcb045"/>
      <stop offset="0.24" stop-color="#f77737"/>
      <stop offset="0.56" stop-color="#e1306c"/>
      <stop offset="1" stop-color="#7a3bd6"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.28" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#5a0f3a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- zemin -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#gloss)"/>
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
  <g filter="url(#sh)">
    <!-- oynat üçgeni (yuvarlak köşeli) -->
    <path d="M50 33 L50 77 L88 55 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <!-- ilerleme çubuğu -->
    <rect x="24" y="96" width="80" height="9" rx="4.5" fill="#fff" fill-opacity="0.38"/>
    <rect x="24" y="96" width="50" height="9" rx="4.5" fill="#fff"/>
    <circle cx="74" cy="100.5" r="9" fill="#fff"/>
  </g>
</svg>
